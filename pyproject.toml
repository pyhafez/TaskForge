[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "A reliable, observable Django task platform"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2.13,<5.3", "djangorestframework>=3.16,<4",
  "celery[redis]>=5.6,<6", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "dj-database-url>=2.3,<4",
  "PyJWT>=2.10,<3", "argon2-cffi>=23.1", "structlog>=25,<27",
  "httpx>=0.28,<1", "typer>=0.15,<1", "gunicorn>=23,<26",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1", "testcontainers[postgres,redis]>=4.10,<5"]
observability = [
  "opentelemetry-sdk>=1.31,<2", "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-instrumentation-django>=0.52b0,<1",
  "opentelemetry-instrumentation-celery>=0.52b0,<1",
  "opentelemetry-instrumentation-redis>=0.52b0,<1",
  "opentelemetry-instrumentation-psycopg>=0.52b0,<1",
]

[project.scripts]
taskforge = "taskforge.cli:app"
taskforge-server = "taskforge.server:main"

[tool.setuptools.packages.find]
include = ["taskforge*"]

[tool.setuptools.package-data]
taskforge = ["templates/*.html", "static/taskforge/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskforge.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests using real PostgreSQL, Redis and worker processes", "load: concurrent execution performance checks"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".test-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
